name: Publish Engine frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: engine-pages
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ vars.ENGINE_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ENGINE_API_URL: ${{ vars.ENGINE_API_URL }}
      ENGINE_PAGES_BASE_PATH: /engine
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run test:template-editor
      - name: Wait for the matching Render backend
        run: node scripts/wait-backend.mjs
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out
      - uses: actions/deploy-pages@v4
        id: deployment
